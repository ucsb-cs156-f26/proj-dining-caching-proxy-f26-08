# H2 file-based datasource for local development (no Postgres required)
spring.datasource.url=jdbc:h2:file:./target/db-development
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable the H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# Embedded MongoDB (no separate MongoDB install needed for local dev)
de.flapdoodle.mongodb.embedded.version=8.0.23

logging.level.edu.ucsb.cs156.diningcachingproxy=DEBUG
